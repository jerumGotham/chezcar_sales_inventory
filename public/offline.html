<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chezcar Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; background: #f8fafc; color: #0f172a; }
      main { width: min(92vw, 32rem); border: 1px solid #bbf7d0; border-radius: 1.5rem; background: white; padding: 2rem; box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12); }
      h1 { margin: 0 0 0.75rem; font-size: 1.75rem; }
      p { color: #475569; line-height: 1.6; }
      a { display: inline-block; margin-top: 1rem; border-radius: 999px; background: #16a34a; color: white; padding: 0.75rem 1rem; text-decoration: none; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>Offline Mode</h1>
      <p>The cloud server is unreachable. If this branch device was activated and POS was opened while online, use the cached POS screen to queue direct sales.</p>
      <a href="/pos">Open Offline POS</a>
    </main>
  </body>
</html>
