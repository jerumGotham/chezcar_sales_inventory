name: Coolify CD

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production

    steps:
      - name: Reject a superseded CI run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "${current_sha}" = "${VERIFIED_SHA}" || {
            echo "main advanced after this CI run; the newer commit must pass CI before deployment"
            exit 1
          }

      - name: Promote approved image
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          image_name="$(printf '%s' "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker buildx imagetools create --tag "${image_name}:production" "${image_name}:${VERIFIED_SHA}"

      - name: Trigger Coolify deployment
        env:
          COOLIFY_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: >-
          curl --fail-with-body --silent --show-error
          --request GET
          --header "Authorization: Bearer ${COOLIFY_API_TOKEN}"
          "${COOLIFY_DEPLOY_WEBHOOK_URL}"
