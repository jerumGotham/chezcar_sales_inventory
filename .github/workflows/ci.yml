name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.20.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:55435/chezcar_test_01_13?schema=public

      - name: Production build
        run: npm run build

      - name: Coolify image build
        run: docker build --tag chezcar:${{ github.sha }} .

      - name: Export verified image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save chezcar:${{ github.sha }} | gzip > chezcar-image.tar.gz

      - name: Transfer verified image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chezcar-${{ github.sha }}
          path: chezcar-image.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write

    steps:
      - name: Download verified image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chezcar-${{ github.sha }}

      - name: Load verified image
        run: gzip --decompress --stdout chezcar-image.tar.gz | docker load

      - name: Publish verified image
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          image_name="$(printf '%s' "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker tag "chezcar:${GITHUB_SHA}" "${image_name}:${GITHUB_SHA}"
          docker tag "chezcar:${GITHUB_SHA}" "${image_name}:production"
          docker push "${image_name}:${GITHUB_SHA}"
          docker push "${image_name}:production"
